# Tunnel Cloudflare — lab.cm-it.fr → serveur Studio local.
#
# Aucun port n'est ouvert sur la box : c'est le Mac qui établit la connexion
# sortante vers Cloudflare. Le certificat TLS est géré par Cloudflare.
#
# À placer dans ~/.cloudflared/config.yml après avoir créé le tunnel,
# en remplaçant <TUNNEL-UUID> par l'identifiant renvoyé à la création.

tunnel: <TUNNEL-UUID>
credentials-file: /Users/max/.cloudflared/<TUNNEL-UUID>.json

ingress:
  # Le serveur de production (5300), jamais celui de développement (5273) :
  # ce dernier expose le rechargement à chaud et les sources.
  - hostname: lab.cm-it.fr
    service: http://127.0.0.1:5300
    originRequest:
      # Les réponses arrivent en flux : pas de mise en tampon.
      disableChunkedEncoding: false
      noTLSVerify: false
      connectTimeout: 30s
      # Une génération peut durer plusieurs minutes sur un gros modèle.
      httpHostHeader: lab.cm-it.fr

  # Tout le reste est refusé.
  - service: http_status:404
